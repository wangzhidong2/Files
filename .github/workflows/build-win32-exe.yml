# Build unpackaged Win32 exe

name: Build Win32 Exe

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/build-win32-exe.yml'
  workflow_dispatch:

run-name: Build Win32 Exe (${{ github.event_name }})

env:
  SOLUTION_PATH: '${{ github.workspace }}\Files.slnx'
  APP_PROJECT_PATH: '${{ github.workspace }}\src\Files.App\Files.App.csproj'
  ARTIFACTS_DIR: '${{ github.workspace }}\artifacts'

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [x64]

    env:
      CONFIGURATION: ${{ matrix.configuration }}
      PLATFORM: ${{ matrix.platform }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Restore Files
      shell: pwsh
      run: |
        msbuild $env:SOLUTION_PATH `
          -t:Restore `
          -p:Platform=$env:PLATFORM `
          -p:Configuration=$env:CONFIGURATION `
          -v:quiet

    - name: Build Files (unpackaged Win32)
      shell: pwsh
      run: |
        msbuild $env:APP_PROJECT_PATH `
          -t:Build `
          -p:Configuration=$env:CONFIGURATION `
          -p:Platform=$env:PLATFORM `
          -p:WindowsPackageType=None `
          -v:minimal

    - name: Publish Files (self-contained)
      shell: pwsh
      run: |
        $outputDir = "$env:ARTIFACTS_DIR\Files"
        dotnet publish $env:APP_PROJECT_PATH `
          -c $env:CONFIGURATION `
          -r win-$env:PLATFORM `
          --self-contained false `
          -o $outputDir `
          -p:Platform=$env:PLATFORM

    - name: Upload exe artifacts
      uses: actions/upload-artifact@v7
      with:
        name: 'Files Win32 Exe (${{ env.CONFIGURATION }}, ${{ env.PLATFORM }})'
        path: ${{ env.ARTIFACTS_DIR }}
