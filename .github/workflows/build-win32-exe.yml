# Build unpackaged Win32 exe

name: Build Win32 Exe

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/build-win32-exe.yml'
  workflow_dispatch:

run-name: Build Win32 Exe (${{ github.event_name }})

env:
  SOLUTION_PATH: '${{ github.workspace }}\Files.slnx'
  APP_PROJECT_PATH: '${{ github.workspace }}\src\Files.App\Files.App.csproj'
  ARTIFACTS_DIR: '${{ github.workspace }}\artifacts'

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [x64]

    env:
      CONFIGURATION: ${{ matrix.configuration }}
      PLATFORM: ${{ matrix.platform }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Restore Files
      shell: pwsh
      run: |
        msbuild $env:SOLUTION_PATH `
          -t:Restore `
          -p:Platform=$env:PLATFORM `
          -p:Configuration=$env:CONFIGURATION `
          -v:quiet

    - name: Build Files (unpackaged Win32)
      shell: pwsh
      run: |
        msbuild $env:APP_PROJECT_PATH `
          -t:Build `
          -p:Configuration=$env:CONFIGURATION `
          -p:Platform=$env:PLATFORM `
          -p:WindowsPackageType=None `
          -p:RuntimeIdentifier=win-$env:PLATFORM `
          -p:SelfContained=false `
          -v:minimal

    - name: Copy build output and installer scripts to artifacts
      shell: pwsh
      run: |
        $binDir = "$env:GITHUB_WORKSPACE\src\Files.App\bin\$env:PLATFORM\$env:CONFIGURATION\net10.0-windows10.0.26100.0\win-$env:PLATFORM"
        Write-Host "Copying from: $binDir"
        New-Item -ItemType Directory -Force -Path "$env:ARTIFACTS_DIR\Files"
        Copy-Item -Path "$binDir\*" -Destination "$env:ARTIFACTS_DIR\Files\" -Recurse -Force

        # Copy installer scripts to artifacts root
        Copy-Item -Path "$env:GITHUB_WORKSPACE\installer\install.ps1" -Destination "$env:ARTIFACTS_DIR\" -Force
        Copy-Item -Path "$env:GITHUB_WORKSPACE\installer\uninstall.ps1" -Destination "$env:ARTIFACTS_DIR\" -Force

        Write-Host "Files in artifacts:"
        Get-ChildItem "$env:ARTIFACTS_DIR\Files" -Filter "*.exe" | ForEach-Object { Write-Host "  $($_.Name)" }
        Write-Host "Installer scripts:"
        Get-ChildItem "$env:ARTIFACTS_DIR" -Filter "*.ps1" | ForEach-Object { Write-Host "  $($_.Name)" }

    - name: Upload exe artifacts
      uses: actions/upload-artifact@v7
      with:
        name: 'Files Win32 Exe (${{ env.CONFIGURATION }}, ${{ env.PLATFORM }})'
        path: ${{ env.ARTIFACTS_DIR }}
